name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24', '1.25']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      shell: bash
      run: |
        mapfile -t packages < <(go list ./... | grep -v -E '/cmd/|/rules$')
        go test -v -race -coverprofile=coverage.txt -covermode=atomic "${packages[@]}"

    - name: Enforce production-package coverage floor
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
      shell: bash
      run: |
        coverage="$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
        echo "Production-package coverage: ${coverage}%"
        awk -v coverage="${coverage}" 'BEGIN { exit !(coverage + 0 >= 90) }'

    # - name: Upload coverage
    #   if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
    #   uses: codecov/codecov-action@v4
    #   with:
    #     files: ./coverage.txt
    #     fail_ci_if_error: false
    #   env:
    #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=5m

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run FuzzParseCII
      run: go test -fuzz=FuzzParseCII -fuzztime=30s

    - name: Run FuzzParseUBL
      run: go test -fuzz=FuzzParseUBL -fuzztime=30s

    - name: Run FuzzValidate
      run: go test -fuzz=FuzzValidate -fuzztime=30s

    - name: Run FuzzRoundTrip
      run: go test -fuzz=FuzzRoundTrip -fuzztime=30s

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run benchmarks
      run: go test -bench=. -benchmem -benchtime=100ms -run=^$ ./...

  release-boundary:
    name: Pure-Go release boundary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Reject Java artifacts and build a static CLI
      shell: bash
      run: |
        if find . -path ./.git -prune -o -type f \
          \( -name '*.java' -o -name '*.class' -o -name '*.jar' \
             -o -name '*.jmod' -o -name '*.war' -o -name '*.ear' \
             -o -name 'pom.xml' -o -name 'build.gradle*' \) \
          -print -quit | grep -q .; then
          echo 'Java artifact found in the public module'
          exit 1
        fi
        CGO_ENABLED=0 go build -trimpath -o einvoice ./cmd/einvoice
        test "$(go version -m ./einvoice | awk '$1 == "build" && $2 == "CGO_ENABLED=0" {print $2}')" = 'CGO_ENABLED=0'
