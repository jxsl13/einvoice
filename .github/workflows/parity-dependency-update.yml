name: Update parity reference toolchain

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify latest releases and show the manifest diff without opening a PR
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: parity-reference-update
  cancel-in-progress: false

jobs:
  update:
    name: Verify and propose parity pins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve releases and verify asset digests
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT

          resolve_release() {
            local key="$1"
            local repository="$2"
            local asset_filter="$3"
            local release asset digest actual url

            release="$(gh api "repos/${repository}/releases/latest")"
            asset="$(jq -cer --arg filter "${asset_filter}" \
              'first(.assets[] | select(.name | test($filter)))' <<<"${release}")"
            digest="$(jq -r '.digest // ""' <<<"${asset}")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Missing trusted SHA-256 for ${repository}" >&2
              exit 1
            fi
            url="$(jq -r '.browser_download_url' <<<"${asset}")"
            curl --fail --location --silent --show-error \
              --max-time 120 --output "${work}/${key}" "${url}"
            actual="$(sha256sum "${work}/${key}" | cut -d ' ' -f 1)"
            if [[ "${actual}" != "${digest#sha256:}" ]]; then
              echo "Digest mismatch for ${repository}" >&2
              exit 1
            fi

            jq -cn \
              --arg repository "${repository}" \
              --arg version "$(jq -r '.tag_name' <<<"${release}")" \
              --arg asset "$(jq -r '.name' <<<"${asset}")" \
              --arg url "${url}" \
              --arg sha256 "${actual}" \
              '{repository:$repository,version:$version,asset:$asset,url:$url,sha256:$sha256,license:"Apache-2.0",ships:false}'
          }

          pin_url() {
            local key="$1" repository="$2" version="$3" asset="$4" url="$5" license="$6" ships="$7"
            local actual
            curl --fail --location --silent --show-error --max-time 120 \
              --output "${work}/${key}" "${url}"
            actual="$(sha256sum "${work}/${key}" | cut -d ' ' -f 1)"
            jq -cn --arg repository "${repository}" --arg version "${version}" \
              --arg asset "${asset}" --arg url "${url}" --arg sha256 "${actual}" \
              --arg license "${license}" --argjson ships "${ships}" \
              '{repository:$repository,version:$version,asset:$asset,url:$url,sha256:$sha256,license:$license,ships:$ships}'
          }

          source_pin() {
            local key="$1" repository="$2" tag="$3" license="$4"
            local commit asset url
            commit="$(gh api "repos/${repository}/commits/${tag}" --jq '.sha')"
            asset="${commit}.zip"
            url="https://github.com/${repository}/archive/${commit}.zip"
            pin_url "${key}" "${repository}" "${commit}" "${asset}" "${url}" "${license}" false
          }

          property() {
            local name="$1" file="$2"
            sed -n -E "s/.*name=\"${name}\" value=\"([^\"]+)\".*/\1/p" "${file}" | head -n 1
          }

          validator="$(resolve_release validator itplr-kosit/validator 'standalone\.jar$')"
          configuration="$(resolve_release configuration itplr-kosit/validator-configuration-xrechnung 'validator-configuration-.*\.zip$')"
          schematron="$(resolve_release schematron itplr-kosit/xrechnung-schematron 'schematron-.*\.zip$')"
          configuration_source="$(source_pin configuration-source itplr-kosit/validator-configuration-xrechnung "$(jq -r '.version' <<<"${configuration}")" Apache-2.0)"
          schematron_source="$(source_pin schematron-source itplr-kosit/xrechnung-schematron "$(jq -r '.version' <<<"${schematron}")" Apache-2.0)"

          mkdir -p "${work}/configuration-source-unpacked"
          unzip -q "${work}/configuration-source" -d "${work}/configuration-source-unpacked"
          config_commit="$(jq -r '.version' <<<"${configuration_source}")"
          build="${work}/configuration-source-unpacked/validator-configuration-xrechnung-${config_commit}/build.xml"
          test -f "${build}"
          xr_version="$(property xrechnung.version.major.minor "${build}").$(property xrechnung.version.patch "${build}")"
          testsuite_version="$(property xr.testsuite.version "${build}")"
          mutate_version="$(property xmute.version.full "${build}")"
          cen_version="$(property cen.rules.version "${build}")"
          ubl_version="$(property ubl.version "${build}")"
          cii_version="$(property cii.version "${build}")"

          testsuite_asset="xrechnung-${xr_version}-testsuite-${testsuite_version}.zip"
          testsuite_url="https://projekte.kosit.org/api/v4/projects/356/packages/maven/de/xeinkauf/xrechnung-${xr_version}-testsuite/${testsuite_version}/${testsuite_asset}"
          testsuite="$(pin_url testsuite itplr-kosit/validator-configuration-xrechnung "${testsuite_version}" "${testsuite_asset}" "${testsuite_url}" Apache-2.0 false)"
          mutate_asset="xml-mutate-${mutate_version}.jar"
          mutate_url="https://projekte.kosit.org/api/v4/projects/356/packages/maven/de/kosit/xml-mutate/${mutate_version}/${mutate_asset}"
          mutate="$(pin_url xml-mutate itplr-kosit/validator-configuration-xrechnung "${mutate_version}" "${mutate_asset}" "${mutate_url}" Apache-2.0 false)"
          cen_ubl_asset="en16931-ubl-${cen_version}.zip"
          cen_ubl_url="https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/download/validation-${cen_version}/${cen_ubl_asset}"
          cen_ubl="$(pin_url cen-ubl ConnectingEurope/eInvoicing-EN16931 "validation-${cen_version}" "${cen_ubl_asset}" "${cen_ubl_url}" EUPL-1.2 false)"
          cen_cii_asset="en16931-cii-${cen_version}.zip"
          cen_cii_url="https://github.com/ConnectingEurope/eInvoicing-EN16931/releases/download/validation-${cen_version}/${cen_cii_asset}"
          cen_cii="$(pin_url cen-cii ConnectingEurope/eInvoicing-EN16931 "validation-${cen_version}" "${cen_cii_asset}" "${cen_cii_url}" EUPL-1.2 false)"
          ubl_asset="UBL-${ubl_version}.zip"
          ubl_url="https://docs.oasis-open.org/ubl/os-UBL-${ubl_version}/${ubl_asset}"
          ubl="$(pin_url ubl OASIS-Open/ubl-2.1 "${ubl_version}" "${ubl_asset}" "${ubl_url}" LicenseRef-OASIS-UBL-2.1 true)"
          cii_asset="D16B_SCRDM__Subset__CII-${cii_version}.zip"
          cii_url="https://projekte.kosit.org/api/v4/projects/356/packages/maven/de/xeinkauf/D16B_SCRDM__Subset__CII/${cii_version}/${cii_asset}"
          cii="$(pin_url cii itplr-kosit/validator-configuration-xrechnung "${cii_version}" "${cii_asset}" "${cii_url}" LicenseRef-UNECE-2015 true)"

          docker pull eclipse-temurin:21-jre >/dev/null
          oracle_ref="$(docker image inspect eclipse-temurin:21-jre --format '{{index .RepoDigests 0}}')"
          oracle_digest="${oracle_ref##*@sha256:}"
          oracle="$(jq -cn --arg url "docker.io/library/eclipse-temurin:21-jre@sha256:${oracle_digest}" --arg sha256 "${oracle_digest}" \
            '{repository:"library/eclipse-temurin",version:"21-jre",asset:"container-image",url:$url,sha256:$sha256,license:"GPL-2.0-with-classpath-exception",ships:false}')"

          jq -Sn \
            --argjson validator "${validator}" --argjson configuration "${configuration}" \
            --argjson configurationSource "${configuration_source}" --argjson schematron "${schematron}" \
            --argjson schematronSource "${schematron_source}" --argjson testsuite "${testsuite}" \
            --argjson mutate "${mutate}" --argjson cenUBL "${cen_ubl}" --argjson cenCII "${cen_cii}" \
            --argjson ubl "${ubl}" --argjson cii "${cii}" --argjson oracle "${oracle}" \
            '{schemaVersion:2,dependencies:{kositValidator:$validator,xrechnungConfiguration:$configuration,xrechnungConfigurationSource:$configurationSource,xrechnungSchematron:$schematron,xrechnungSchematronSource:$schematronSource,xrechnungTestsuite:$testsuite,xmlMutate:$mutate,cenUBLRules:$cenUBL,cenCIIRules:$cenCII,ublSchemas:$ubl,ciiSchemas:$cii,oracleRuntime:$oracle}}' \
            > .github/dependencies/parity.json
          jq -e '.schemaVersion == 2 and (.dependencies | length == 12) and all(.dependencies[]; (.sha256 | test("^[0-9a-f]{64}$")))' \
            .github/dependencies/parity.json >/dev/null

          if git diff --quiet -- .github/dependencies/parity.json; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'changed=true' >> "${GITHUB_OUTPUT}"
          git diff -- .github/dependencies/parity.json

      - name: Stop after verified dry run
        if: steps.update.outputs.changed == 'true' && inputs.dry_run == true
        run: echo 'Dry run complete; no branch or pull request was created.'

      - name: Open dependency pull request
        if: steps.update.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/parity-reference-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add .github/dependencies/parity.json
          git commit -m 'chore(deps): update parity reference toolchain'
          git push origin "HEAD:${branch}"

          gh label create dependencies --color 0366d6 \
            --description 'Automated dependency update' --force
          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --title 'chore(deps): update parity reference toolchain' \
            --label dependencies \
            --body 'Updates the checksum-verified, non-shipping KoSIT/XRechnung parity toolchain. The centralized dependency policy enables squash auto-merge only after protected CI passes. Toolchain updates never publish module releases.')"
          gh workflow run ci.yml --ref "${branch}"
          gh workflow run dependency-automerge.yml \
            --ref main \
            -f pull_request="${pr_url##*/}"
