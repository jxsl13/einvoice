name: Dependency auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency:
    name: Arm trusted dependency auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify dependency provenance and enable protected squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          details="$(gh pr view "${PR_URL}" --json author,files,isDraft,labels)"
          if ! jq -e -f .github/release/dependency-automerge.jq \
            <<<"${details}" >/dev/null; then
            echo 'Pull request is not an allowlisted automated dependency update.' >&2
            exit 1
          fi
          gh pr merge "${PR_URL}" --auto --squash
